server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ส่งต่อ Request ที่ขึ้นต้นด้วย /api ไปที่ Service ชื่อ api (Backend) ใน Docker Network
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ไฟล์ใน assets มี hash ในชื่อ จึง Cache ได้นาน
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Fallback: ทุกเส้นทางที่ไม่ใช่ไฟล์จริง ให้ส่ง index.html แล้วให้ Vue Router จัดการต่อ
    location / {
        try_files $uri $uri/ /index.html;
    }
}